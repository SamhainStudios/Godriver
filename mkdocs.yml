site_name: Godriver
site_url: https://samhainstudios.github.io/godot-test-driver/
repo_url: https://github.com/samhainstudios/godot-test-driver
repo_name: samhainstudios/godot-test-driver

theme:
  name: material
  logo: Godriver-logo.jpeg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Specification:
    - HTTP API Spec: specification/spec.md
    - Self-Tests: specification/self-tests.md
  - Guides:
    - Visual Regression: guides/visual-regression.md
  - Technical:
    - Addon Internals: technical/addon-internals.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true
