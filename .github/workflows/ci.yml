name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    js:
        name: JS client (unit + typecheck)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: js/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: js

            - name: Typecheck
              run: npm run typecheck
              working-directory: js

            - name: Unit tests
              run: npm run test:unit
              working-directory: js

    # Godot engine suite (GdUnit4) lands with the Phase 4 CI-matrix brief
    # (GTD-040: 4.3/4.5/4.7 x Linux/Windows +/- headless). Kept out of the
    # default CI until the runner setup is specced.
